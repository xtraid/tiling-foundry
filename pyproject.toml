[project]
name = "tiling-foundry"
version = "0.1.0"
description = "Verified research tools for the Yang–Zhang 23-Wang-tile reduction"
requires-python = ">=3.11"
dependencies = [
    "z3-solver>=4.15,<6",
]

[dependency-groups]
dev = [
    "coverage[toml]>=7.10,<8",
    "gcovr>=8.3,<9",
]

[tool.uv]
package = false

[tool.coverage.run]
branch = true
source = ["python"]

[tool.coverage.report]
show_missing = true
skip_covered = false

<svg xmlns="http://www.w3.org/2000/svg" width="560" height="700" viewBox="0 0 560 700" role="img" aria-labelledby="title desc">
  <title id="title">Decision inputs and independent witness checks</title>
  <desc id="desc">Formula branches to Boolean Z3 and Yang–Zhang. The region and tileset feed Reference C, Optimized C and Wang Z3. All returned SAT witnesses enter independent checks before presentation. Reference and optimized share a native core; Boolean and Wang encodings share Z3.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
  <style>
    text { font-family: system-ui, sans-serif; fill: #17212f; text-anchor: middle; font-size: 20px; }
    rect { fill: #eef3f8; stroke: #64748b; stroke-width: 1.5; rx: 10; }
    .flow { fill: none; stroke: #475569; stroke-width: 2; marker-end: url(#arrow); }
    .small { font-size: 17px; }
    .check { fill: #e0f2e7; stroke: #337451; }
  </style>
  <path fill="#fff" d="M0 0h560v700H0z"/>
  <rect x="180" y="20" width="200" height="55"/>
  <text x="280" y="55">Formula</text>
  <path class="flow" d="M230 75V100H85V130"/>
  <path class="flow" d="M330 75V100H355V130"/>
  <rect x="15" y="130" width="140" height="65"/>
  <text x="85" y="169">Boolean Z3</text>
  <rect x="245" y="130" width="220" height="65"/>
  <text x="355" y="169">Yang–Zhang</text>
  <path class="flow" d="M355 195V230"/>
  <rect x="245" y="230" width="220" height="65"/>
  <text x="355" y="258">Region</text><text x="355" y="283">+ fixed tileset</text>
  <path class="flow" d="M355 295V318H235V350"/>
  <path class="flow" d="M355 295V350"/>
  <path class="flow" d="M355 295V318H475V350"/>
  <rect x="175" y="350" width="115" height="70"/>
  <text x="232" y="380" class="small">Reference C</text><text x="232" y="405" class="small">shared core</text>
  <rect x="300" y="350" width="110" height="70"/>
  <text x="355" y="380" class="small">Optimized C</text><text x="355" y="405" class="small">shared core</text>
  <rect x="425" y="350" width="120" height="70"/>
  <text x="485" y="391">Wang Z3</text>
  <path class="flow" d="M85 195V535"/>
  <text x="98" y="463" class="small" style="text-anchor:start">SAT</text><text x="98" y="485" class="small" style="text-anchor:start">assignment</text>
  <path d="M232 420V485H485V420M355 420V485" fill="none" stroke="#475569" stroke-width="2"/>
  <path class="flow" d="M355 485V535"/>
  <text x="421" y="515" class="small">SAT tilings</text>
  <rect class="check" x="20" y="535" width="520" height="65"/>
  <text x="280" y="562">Independent checks</text>
  <text x="280" y="588" class="small">Returned witnesses + original inputs</text>
  <path class="flow" d="M280 600V630"/>
  <rect class="check" x="110" y="630" width="340" height="55"/>
  <text x="280" y="664">Checked witness presentation</text>
</svg>

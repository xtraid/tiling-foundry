{% if include.documents.size > 0 %}
  <ol class="document-list">
    {% for document in include.documents %}
      <li>
        <a href="{{ document.url | relative_url }}">
          <span class="document-list__body">
            <strong>{{ document.title | escape }}</strong>
            <span>{{ document.description | escape }}</span>
          </span>
          <span class="document-list__kind">
            {{ document.document_kind | escape }} · {{ document.status | escape }}
          </span>
        </a>
      </li>
    {% endfor %}
  </ol>
{% endif %}

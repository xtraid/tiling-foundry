<figure class="narrative-asset narrative-static" data-asset-id="{{ include.asset_id | escape }}">
  <img
    src="{{ include.image | relative_url }}"
    alt="{{ include.alt | escape }}"
    width="{{ include.width }}"
    height="{{ include.height }}"
    loading="lazy"
    decoding="async"
  >
  <figcaption>
    <strong>{{ include.label | escape }}.</strong>
    {{ include.caption | escape }}
    <span class="asset-source">Source contract: <code>{{ include.source | escape }}</code>.</span>
  </figcaption>
</figure>
